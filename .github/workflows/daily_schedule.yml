name: Daily YouTube Video Auto-Publisher

on:
  schedule:
    # 4:45 PM Mexico City Time (UTC-6) = 22:45 UTC everyday
    - cron: '45 22 * * *'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'YouTube upload privacy status'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private
      duration:
        description: 'Target duration in seconds (0 for full audio, or 180 for 3 min)'
        required: false
        default: '180'
        type: string

permissions:
  contents: write

jobs:
  publish-daily-video:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js for yt-dlp challenge solving
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Deno for yt-dlp EJS solver
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install system dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade yt-dlp
          pip install numpy imageio_ffmpeg gtts

      - name: Run Daily Auto-Publisher & YouTube Upload
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CI: 'true'
        run: |
          PRIVACY="${{ github.event.inputs.privacy || 'public' }}"
          DURATION="${{ github.event.inputs.duration || '180' }}"
          echo "🚀 Starting Daily Video Auto-Publisher..."
          echo "   Target Privacy: $PRIVACY | Duration: ${DURATION}s"
          python daily_worker.py --privacy "$PRIVACY" --duration "$DURATION"

      - name: Commit & Push Updated Video Queue
        if: always()
        run: |
          git config --global user.name "Daily Automation Bot"
          git config --global user.email "bot@youtube-automation.local"
          git add data/posted_videos.json docs/index.html
          git commit -m "Auto-published daily video [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"

      - name: Upload Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-published-video-output
          path: output/
          retention-days: 14
